<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Undercover: Kasus Kejahatan Siber</title>
<style>
  :root{ --bg:#0a0e1a; --panel:#161d2e; --accent:#f5a623; --off:#3d4759; --text:#eef2f7; }
  *{box-sizing:border-box; touch-action:manipulation}
  html,body{height:100%; margin:0}
  body{background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; padding:8px; display:flex; justify-content:center}
  .panel{background:var(--panel); border-radius:14px; padding:12px; width:100%; max-width:960px; box-shadow:0 4px 20px rgba(0,0,0,.2)}
  #mapCanvasSlot{width:100%; height:min(70dvh, 640px); min-height:240px; image-rendering:pixelated}
  #mapCanvasSlot canvas{border-radius:10px; display:block}
  .dpad{display:grid; grid-template-columns:repeat(3,48px); grid-template-rows:repeat(3,48px); gap:4px; justify-content:center; margin-top:8px}
  .dpad button{border:none; border-radius:10px; background:var(--off); color:var(--text); font-size:1rem; cursor:pointer}
  .dpad button:active{background:var(--accent)}
  @media (min-width:760px){ .dpad{display:none} }
</style>
</head>
<body>
<div class="panel">
  <div id="mapCanvasSlot"></div>
  <div class="dpad">
    <div></div><button id="btnUp">▲</button><div></div>
    <button id="btnLeft">◀</button><div></div><button id="btnRight">▶</button>
    <div></div><button id="btnDown">▼</button><div></div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
